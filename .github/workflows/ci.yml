name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'media-tracker/package-lock.json'
      
      - name: Install dependencies
        working-directory: media-tracker
        run: npm ci
      
      - name: Run ESLint
        working-directory: media-tracker
        run: npm run lint
      
      - name: Run TypeScript typecheck
        working-directory: media-tracker
        run: npm run typecheck
      
      - name: Build project
        working-directory: media-tracker
        run: npm run build
